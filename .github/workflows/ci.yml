  ml-validate:
    name: ML — Artifacts Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnx onnxruntime

      - name: Validate scaler params
        run: |
          python -c "
          import json
          from pathlib import Path
          data = json.loads(Path('backend/ml/scaler_params.json').read_text())
          assert len(data['mean']) == 41
          assert len(data['scale']) == 41
          print('Scaler params OK (41 features)')
          "

      - name: Validate ONNX model (if present)
        run: |
          python -c "
          import os, sys
          path = 'backend/ml/ghostid_encoder.onnx'
          if not os.path.exists(path):
              print('ONNX model not yet trained — skipping validation')
              sys.exit(0)

          import onnx
          import onnxruntime as ort
          import numpy as np

          model = onnx.load(path)
          onnx.checker.check_model(model)

          sess = ort.InferenceSession(path)

          out = sess.run(
              None,
              {'features': np.random.randn(1,1,41).astype(np.float32)}
          )

          assert out[0].shape == (1, 128), f'Shape error: {out[0].shape}'

          norm = np.linalg.norm(out[0])
          assert 0.98 < norm < 1.02, f'Norm error: {norm}'

          print(
              f'ONNX validation passed — shape {out[0].shape}, norm {norm:.4f}'
          )
          "